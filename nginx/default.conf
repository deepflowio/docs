server {
    listen          4000;
    server_name     localhost;

    # 仅中文页面的旧根路径 URL -> /zh/ 新路径(由 scripts/gen-rewrites.mjs 生成)
    include /etc/nginx/zh-only-redirects.conf;

    location / {
        index  index.html index.htm;
        
        root /usr/share/nginx/html;
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';
    
        client_max_body_size 50m;

        # cleanUrls: true 的产物是平铺的 xxx.html,必须尝试 $uri.html,
        # 否则所有干净 URL 都会兜底到首页 HTML,引发客户端水合错乱
        try_files $uri $uri.html $uri/ /docs/index.html;

    }
}
